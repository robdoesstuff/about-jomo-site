  <style>
    :root {
      --bg: #2A2520;
      --surface: #332D28;
      --border: #4A433D;
      --text: #F0EAE0;
      --text-muted: #AAA292;
      --accent: #E8783A;
      --accent-hover: #D56A2F;
      /* Dark text used on the orange CTA so it meets WCAG AA contrast
         (~5.2:1) — light text on the orange only reached 2.44:1. */
      --accent-text: #241F1B;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* Visually hidden but available to screen readers. */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Clear keyboard focus indicator (WCAG 2.4.7). Offset so the ring sits
       against the dark page background for strong contrast. */
    a:focus-visible {
      outline: 3px solid var(--text);
      outline-offset: 3px;
      border-radius: 4px;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
        animation: none !important;
        scroll-behavior: auto !important;
      }
    }

    html, body {
      background-color: var(--bg);
      color: var(--text);
      font-family: "DM Sans", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 20px;
    }

    /* Size the vertical Short to fill all available height after reserving
       room for the CTA + contact line below, so the video is as large as
       possible on a portrait phone. Width follows from the 9:16 ratio,
       capped at 92vw so it never overflows on narrow devices. The reserved
       height (--ui-reserve) accounts for the body padding, container gap,
       CTA, actions gap and contact line. */
    .video-wrapper {
      --ui-reserve: 194px;
      width: min(92vw, calc((100dvh - var(--ui-reserve)) * 9 / 16));
      aspect-ratio: 9 / 16;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--surface);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    }

    .video-wrapper iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
    }

    .cta {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 360px;
      background: var(--accent);
      color: var(--accent-text);
      font-size: 18px;
      font-weight: 700;
      text-decoration: none;
      padding: 16px 28px;
      border-radius: 12px;
      transition: background-color 0.15s ease, transform 0.05s ease;
      box-shadow: 0 6px 20px rgba(232, 120, 58, 0.3);
    }

    .cta:hover { background: var(--accent-hover); }
    .cta:active { transform: translateY(1px); }

    .pricing-link {
      font-size: 16px;
      font-weight: 500;
      color: var(--accent);
      text-decoration: underline;
    }

    .pricing-link:hover { text-decoration: none; }

    .contact {
      font-size: 15px;
      color: var(--text-muted);
    }

    .contact a {
      color: var(--accent);
      text-decoration: underline;
      font-weight: 500;
    }

    .contact a:hover { text-decoration: none; }
  </style>
</head>
<body>
  <main class="container">
    <h1 class="sr-only">Jomo — Bring your customers back</h1>
    <div class="video-wrapper">
      <iframe
        id="jomo-video"
        src="https://www.youtube-nocookie.com/embed/yGAJxfBpPvQ?playsinline=1&enablejsapi=1"
        title="What is Jomo?"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen></iframe>
    </div>

    <div class="actions">
      <a class="cta" id="cta" href="https://thejomoapp.com">Try Jomo — Get Started</a>
      <a class="pricing-link" href="pricing.html">See pricing &amp; plans</a>
      <p class="contact">
        Questions? Email <a href="mailto:info@horoco.co">info@horoco.co</a>
      </p>
    </div>
  </main>

  <!-- Event tracking: video engagement + CTA conversion -->
  <script>
    // Conversion: click on the primary CTA ("Try Jomo"). Capture before the
    // browser navigates away; PostHog uses keepalive/sendBeacon so the event
    // still reaches the server.
    (function () {
      var cta = document.getElementById('cta');
      if (cta) {
        cta.addEventListener('click', function () {
          posthog.capture('cta_click', { destination: cta.href });
        });
      }
    })();

    // Video engagement: use the YouTube IFrame Player API so we capture real
    // play/finish events rather than guessing at clicks inside the iframe.
    (function () {
      var tag = document.createElement('script');
      tag.src = 'https://www.youtube.com/iframe_api';
      document.head.appendChild(tag);
    })();

    var jomoPlayCaptured = false;
    function onYouTubeIframeAPIReady() {
      new YT.Player('jomo-video', {
        events: {
          onStateChange: function (event) {
            if (event.data === YT.PlayerState.PLAYING && !jomoPlayCaptured) {
              jomoPlayCaptured = true;
              posthog.capture('video_play');
            } else if (event.data === YT.PlayerState.ENDED) {
              posthog.capture('video_complete');
            }
          }
        }
      });
    }
  </script>
</body>
</html>
